services:
    db:
        image: postgres:16-alpine
        env_file: .env
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
                          POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: [ ∏ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
            interval: 5s
            timeout: 3s
            retries: 20

    api:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
            target: runtime
        volumes:
            - ./apps/api/public/uploads:/app/apps/api/public/uploads
        env_file: .env
        environment:
            NODE_ENV: production
            DATABASE_URL: ${DATABASE_URL}
            WEB_ORIGIN: ${WEB_ORIGIN}
            TRUST_PROXY: "false"

            RUN_MIGRATIONS: "true"
            RUN_SEEDS: "true"
            DEMO_MODE: ${DEMO_MODE}
            SEED_DEMO_RESET: "true"

            COOKIE_SECURE: "false"
            COOKIE_SAMESITE: "lax"

            AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET}
            AUTH_REFRESH_TOKEN_SECRET: ${AUTH_REFRESH_TOKEN_SECRET}
            AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL}
            AUTH_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TOKEN_TTL}
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "3001:3001"

    web:
        build:
            context: .
            dockerfile: apps/web/Dockerfile
            target: dev
        env_file: .env
        environment:
            VITE_API_URL: ${VITE_API_URL}
        volumes:
            - ./apps/web:/app/apps/web
            - /app/apps/web/node_modules
        ports:
            - "5173:5173"
        tty: true
        depends_on:
            - api

volumes:
    pgdata:
