<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>

		<title>KONEVX</title>
		<meta
			name="description"
			content="KONEVX: administra eventos, registros y asistentes de forma eficiente."
		/>
		<meta name="theme-color" content="#2563eb" />

		<link rel="icon" href="/favicon.ico?v=2   " />

		<meta property="og:title" content="KONEVX" />
		<meta
			property="og:description"
			content="Administra eventos, registros y asistentes."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://KONEVX.app/" />

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="KONEVX" />
		<meta
			name="twitter:description"
			content="Administra eventos, registros y asistentes."
		/>

		<style>
			body {
				margin: 0;
				padding: 0;
				background-color: #f8fafc;
			}
			.initial-loader {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				height: 100vh;
				font-family:
					system-ui,
					-apple-system,
					sans-serif;
			}
			.spinner {
				width: 40px;
				height: 40px;
				border: 4px solid #e2e8f0;
				border-top: 4px solid #2563eb; /* primary.main */
				border-radius: 50%;
				animation: spin 1s linear infinite;
				margin-bottom: 16px;
			}
			.loading-text {
				color: #64748b;
				font-size: 0.875rem;
				font-weight: 500;
				animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
			}
			@keyframes spin {
				0% {
					transform: rotate(0deg);
				}
				100% {
					transform: rotate(360deg);
				}
			}
			@keyframes pulse {
				0%,
				100% {
					opacity: 1;
				}
				50% {
					opacity: 0.5;
				}
			}
		</style>
	</head>

	<body>
		<noscript>Necesitas habilitar JavaScript para usar esta app.</noscript>

		<div id="root">
			<div class="initial-loader">
				<div class="spinner"></div>
				<div class="loading-text">Cargando KONEVX...</div>
			</div>
		</div>

		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
