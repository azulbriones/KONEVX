services:
    db:
        image: postgres:16-alpine
        env_file: .env.prod
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - db_prod:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
                ]
            interval: 5s
            timeout: 3s
            retries: 20

    api:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
            target: runtime
        env_file: .env.prod
        environment:
            NODE_ENV: production
            DATABASE_URL: ${DATABASE_URL}
            WEB_ORIGIN: ${WEB_ORIGIN}
            TRUST_PROXY: "true"
            DEMO_MODE: ${DEMO_MODE}
            RUN_MIGRATIONS: "true"
            RUN_SEEDS: ${RUN_SEEDS}
            COOKIE_SECURE: "true"
            COOKIE_SAMESITE: "lax"
            AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET}
            AUTH_REFRESH_TOKEN_SECRET: ${AUTH_REFRESH_TOKEN_SECRET}
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -qO- http://localhost:3001/api/health || exit 1",
                ]
            interval: 10s
            timeout: 3s
            retries: 20

    web:
        build:
            context: .
            dockerfile: apps/web/Dockerfile
            target: runtime
            args:
                VITE_API_URL: ${VITE_API_URL}
        depends_on:
            api:
                condition: service_healthy
        ports:
            - "80:80"
        healthcheck:
            test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
            interval: 10s
            timeout: 3s
            retries: 20

volumes:
    db_prod:
